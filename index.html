<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeCods - Premium UI Elements</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

</head>
<body class="bg-[#0a0b10] text-gray-200 font-sans antialiased min-h-screen selection:bg-cyan-500 selection:text-black">

    <div class="h-1 w-full bg-gradient-to-r from-cyan-500 via-purple-500 to-pink-500"></div>

    <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0a0b10]/70 border-b border-cyan-500/10 px-4 py-3">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <a href="#" class="text-xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 flex items-center gap-2">
                <i class="fa-solid fa-code text-cyan-400"></i> FREECODS
            </a>

            <div class="flex items-center gap-2">
                <i class="fa-solid fa-earth-americas text-cyan-400/70 text-sm"></i>
                <select id="lang-select" class="bg-[#121420] text-xs font-semibold text-cyan-400 border border-cyan-500/30 rounded-lg px-2 py-1.5 cursor-pointer focus:outline-none focus:border-cyan-400">
                    <option value="tg">🇹🇯 Тоҷикӣ</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 id="hero-title" class="text-3xl md:text-5xl font-extrabold text-white tracking-tight mb-4">
                Кодҳои Тайёри <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">UI/UX Премиум</span>
            </h1>
            <p id="hero-subtitle" class="text-gray-400 max-w-xl mx-auto text-sm md:text-base">
                Кодҳои кутоҳ, тугмаҳо, логин-формаҳо ва эффектҳои футуристиро кобед, видеоашро бинед ва бо як клик скачат кунед.
            </p>
            
            <div class="mt-8 max-w-xl mx-auto relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-purple-500 rounded-xl blur opacity-30 group-hover:opacity-60 transition duration-300"></div>
                <div class="relative flex items-center bg-[#121420] border border-cyan-500/20 rounded-xl overflow-hidden">
                    <i class="fa-solid fa-magnifying-glass text-cyan-400/50 pl-4 text-lg"></i>
                    <input type="text" id="search-input" placeholder="Ҷустуҷӯи код (масалан: Login, Button)..." class="w-full bg-transparent py-4 px-3 text-white placeholder-gray-500 focus:outline-none text-sm md:text-base">
                </div>
            </div>
        </div>

        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>

        <div id="no-results" class="hidden text-center py-12">
            <i class="fa-solid fa-folder-open text-gray-600 text-5xl mb-3"></i>
            <p class="text-gray-500" id="no-results-text">Ҳеҷ чиз ёфт нашуд.</p>
        </div>
    </main>

    <footer class="border-t border-cyan-500/5 mt-20 py-6 text-center text-xs text-gray-600">
        <p>&copy; 2026 FREECODS. All Rights Reserved. Powered for Adsterra.</p>
    </footer>

    <script src="database.js"></script>
    <script src="bots.js"></script>
    <script src="app.js"></script>
</body>
</html>
